name: Build AndUEDumper

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Android NDK manually
      run: |
        # 手动下载和安装 Android NDK
        wget https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
        unzip android-ndk-r25c-linux.zip -d /opt
        echo "NDK_HOME=/opt/android-ndk-r25c" >> $GITHUB_ENV
        echo "PATH=/opt/android-ndk-r25c:$PATH" >> $GITHUB_ENV
    
    - name: Install required tools
      run: |
        sudo apt-get update
        sudo apt-get install -y make build-essential clang
    
    - name: Navigate to project directory
      run: |
        # 切换到项目目录
        if [ -d "AndUEDumper/AndUEDumper" ]; then
          cd AndUEDumper/AndUEDumper
        elif [ -d "AndUEDumper" ]; then
          cd AndUEDumper
        fi
        
        echo "当前目录: $(pwd)"
        echo "NDK_HOME: $NDK_HOME"
        ls -la
    
    - name: Build project
      run: |
        # 确保在正确的目录
        echo "构建目录: $(pwd)"
        
        # 检查 Makefile 是否存在
        if [ ! -f "Makefile" ]; then
          echo "错误: 在当前目录找不到 Makefile"
          find ../ -name "Makefile" | head -5
          exit 1
        fi
        
        # 显示 Makefile 内容
        echo "Makefile 内容:"
        head -50 Makefile
        
        # 运行 make
        echo "运行 make clean..."
        make clean || echo "make clean 失败，继续..."
        
        echo "运行 make..."
        make
    
    - name: Upload build results
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: andue-dumper-build
        path: |
          **/*.so
          **/*.a
          **/dumper
          **/AndUEDumper
          **/*.out
          **/*.bin
        if-no-files-found: warn