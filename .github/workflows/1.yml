name: Build AndUEDumper with Project Scripts

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Android NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
        unzip -q android-ndk-r21e-linux-x86_64.zip -d /opt/
        
        echo "NDK_HOME=/opt/android-ndk-r21e" >> $GITHUB_ENV
        echo "PATH=/opt/android-ndk-r21e:$PATH" >> $GITHUB_ENV
    
    - name: Check project scripts
      run: |
        # 进入项目目录
        if [ -d "AndUEDumper-main/AndUEDumper" ]; then
          cd AndUEDumper-main/AndUEDumper
        fi
        
        echo "=== 检查项目脚本 ==="
        ls -la *.sh *.bat
        
        echo ""
        echo "=== ndk-build.sh 内容 ==="
        if [ -f "ndk-build.sh" ]; then
          cat ndk-build.sh
        fi
        
        echo ""
        echo "=== Makefile 内容 ==="
        if [ -f "Makefile" ]; then
          head -50 Makefile
        fi
    
    - name: Try project's ndk-build.sh
      run: |
        # 进入项目目录
        if [ -d "AndUEDumper-main/AndUEDumper" ]; then
          cd AndUEDumper-main/AndUEDumper
        fi
        
        echo "尝试运行项目自带的 ndk-build.sh..."
        
        if [ -f "ndk-build.sh" ]; then
          chmod +x ndk-build.sh
          ./ndk-build.sh
        else
          echo "错误: 找不到 ndk-build.sh"
        fi
    
    - name: Try Makefile targets
      run: |
        # 进入项目目录
        if [ -d "AndUEDumper-main/AndUEDumper" ]; then
          cd AndUEDumper-main/AndUEDumper
        fi
        
        echo "尝试 Makefile 目标..."
        
        if [ -f "Makefile" ]; then
          echo "Makefile 中的目标:"
          grep -E "^[a-zA-Z]" Makefile | grep -v "^#" | head -20
          
          # 尝试不同的目标
          echo ""
          echo "尝试 'make' (默认目标)..."
          make clean && make
          
          # 检查是否有其他目标
          if grep -q "executable" Makefile; then
            echo ""
            echo "尝试 'make executable'..."
            make clean
            make executable
          fi
          
          if grep -q "library" Makefile; then
            echo ""
            echo "尝试 'make library'..."
            make clean
            make library
          fi
        fi
    
    - name: Create final package with both versions
      run: |
        # 进入项目目录
        if [ -d "AndUEDumper-main/AndUEDumper" ]; then
          cd AndUEDumper-main/AndUEDumper
        fi
        
        echo "创建最终打包文件..."
        
        # 创建输出目录
        mkdir -p ../output
        
        # 复制所有可能的构建文件
        if [ -d "libs" ]; then
          echo "复制 libs 目录..."
          cp -r libs ../output/
        fi
        
        if [ -d "obj" ]; then
          echo "复制 obj 目录..."
          cp -r obj ../output/
        fi
        
        # 查找可执行文件
        echo "查找可执行文件..."
        find . -type f \( -name "UEDump3r" -o -name "AndUEDumper" -o -name "dumper" \) ! -path "./.git/*" | while read f; do
          echo "复制可执行文件: $f"
          cp --parents "$f" ../output/ 2>/dev/null || true
        done
        
        # 创建使用说明
        cat > ../output/USAGE.md << 'EOF'
# AndUEDumper 使用说明

## 文件说明

### 共享库版本 (.so 文件)
- `libs/arm64-v8a/libshared_UEDump3r_arm64.so`
- `libs/armeabi-v7a/libshared_UEDump3r_arm.so`
- `libs/x86/libshared_UEDump3r_x86.so`
- `libs/x86_64/libshared_UEDump3r_x86_64.so`

使用方法（共享库）：
1. 将对应的 .so 文件注入到目标进程
2. 监控 logcat 输出：`logcat -s UEDump3r`
3. 输出文件会在游戏的外部数据目录

### 可执行文件版本
如果构建生成了可执行文件（如 UEDump3r）：

使用方法（可执行文件）：
```bash
# 推送到设备
adb push UEDump3r /data/local/tmp/

# 运行
adb shell
cd /data/local/tmp
chmod +x UEDump3r
./UEDump3r -o /sdcard/output -p com.package.name