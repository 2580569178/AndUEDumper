name: Build AndUEDumper Executable Version

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Android NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
        unzip -q android-ndk-r21e-linux-x86_64.zip -d /opt/
        
        echo "NDK_HOME=/opt/android-ndk-r21e" >> $GITHUB_ENV
        echo "PATH=/opt/android-ndk-r21e:$PATH" >> $GITHUB_ENV
    
    - name: Navigate to project directory
      run: |
        # 进入项目目录
        if [ -d "AndUEDumper-main/AndUEDumper" ]; then
          cd AndUEDumper-main/AndUEDumper
        fi
        
        echo "项目目录: $(pwd)"
        echo "检查构建文件:"
        ls -la src/*.mk
    
    - name: Create custom Android.mk for executable
      run: |
        echo "创建可执行文件版本的 Android.mk..."
        
        # 备份原始 Android.mk
        if [ -f "Android.mk" ]; then
          cp Android.mk Android.mk.backup
        fi
        
        # 创建专门用于构建可执行文件的 Android.mk
        cat > Android_executable.mk << 'EOF'
LOCAL_PATH := $(call my-dir)

# 包含 executable.mk 来构建可执行文件
include $(LOCAL_PATH)/src/executable.mk

# 如果需要，可以在这里添加额外的配置
# LOCAL_CFLAGS += -DEXECUTABLE_BUILD
EOF
        
        echo "Android_executable.mk 创建完成"
    
    - name: Build executable with custom makefile
      run: |
        echo "使用自定义 makefile 构建可执行文件..."
        
        # 使用新的 Android.mk 文件构建
        $NDK_HOME/ndk-build -f Android_executable.mk clean
        $NDK_HOME/ndk-build -f Android_executable.mk
        
        echo "构建完成!"
    
    - name: Check what was built
      run: |
        echo "=== 检查构建结果 ==="
        
        # 查找所有构建产物
        find . -type f \( -name "UEDump3r" -o -name "AndUEDumper" -o -name "dumper" \) ! -path "./.git/*" | while read f; do
          echo "找到: $f"
          file "$f" || true
        done
        
        # 检查 libs 目录
        if [ -d "libs" ]; then
          echo "libs 目录内容:"
          for arch in libs/*/; do
            if [ -d "$arch" ]; then
              echo "  $(basename $arch):"
              find "$arch" -type f ! -name "*.so" | while read f; do
                echo "    - $(basename "$f")"
              done
            fi
          done
        fi
        
        # 如果还是没有可执行文件，尝试直接编译
        if [ -z "$(find . -type f -name "UEDump3r" ! -path "./.git/*")" ]; then
          echo "没有找到 UEDump3r 可执行文件，尝试直接编译..."
          
          # 查看 executable.mk 内容，了解如何编译
          if [ -f "src/executable.mk" ]; then
            echo "executable.mk 内容:"
            head -50 src/executable.mk
          fi
        fi
    
    - name: Try to build using make directly
      run: |
        echo "尝试直接使用 make 构建..."
        
        # 查看 Makefile 内容
        if [ -f "Makefile" ]; then
          echo "Makefile 内容预览:"
          head -30 Makefile
          
          # 尝试使用 make 构建可执行文件
          if grep -q "executable" Makefile; then
            echo "Makefile 包含 executable 目标"
            make clean
            make executable
          else
            echo "尝试 make all"
            make clean
            make
          fi
        fi
    
    - name: Create executable from library (last resort)
      run: |
        echo "=== 最后手段：从共享库创建可执行文件 ==="
        
        # 如果只有 .so 文件，创建一个简单的包装器可执行文件
        for arch in arm64-v8a armeabi-v7a x86 x86_64; do
          if [ -f "libs/$arch/libshared_UEDump3r_$arch.so" ]; then
            echo "为 $arch 创建可执行文件包装器..."
            
            # 使用 NDK 工具链创建简单的 C 程序
            cat > wrapper_$arch.c << 'EOF'
#include <stdio.h>
#include <dlfcn.h>
#include <string.h>

int main(int argc, char *argv[]) {
    printf("AndUEDumper Executable Wrapper (%s)\n", argv[0]);
    printf("Loading shared library...\n");
    
    void* handle = dlopen("./libshared_UEDump3r.so", RTLD_LAZY);
    if (!handle) {
        fprintf(stderr, "Error: %s\n", dlerror());
        return 1;
    }
    
    // 查找并调用库中的主函数
    void (*main_func)(int, char**) = dlsym(handle, "main");
    if (main_func) {
        printf("Calling library main function...\n");
        main_func(argc, argv);
    } else {
        printf("Note: Library does not expose 'main' function.\n");
        printf("This library is meant to be loaded by another process.\n");
        printf("For executable version, please check build configuration.\n");
    }
    
    dlclose(handle);
    return 0;
}
EOF
            
            # 使用 NDK 编译器编译
            case $arch in
                arm64-v8a)
                    COMPILER="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
                    ;;
                armeabi-v7a)
                    COMPILER="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"
                    ;;
                x86)
                    COMPILER="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android21-clang"
                    ;;
                x86_64)
                    COMPILER="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang"
                    ;;
            esac
            
            if [ -n "$COMPILER" ]; then
                $COMPILER wrapper_$arch.c -o "libs/$arch/UEDump3r_wrapper" -ldl
                chmod +x "libs/$arch/UEDump3r_wrapper"
                echo "创建: libs/$arch/UEDump3r_wrapper"
                
                # 复制 .so 文件并重命名以匹配包装器的期望
                cp "libs/$arch/libshared_UEDump3r_$arch.so" "libs/$arch/libshared_UEDump3r.so"
            fi
          fi
        done
    
    - name: Create usage instructions
      run: |
        echo "创建使用说明..."
        
        cat > USAGE.md << 'EOF'
# AndUEDumper 可执行文件使用说明

## 情况分析

根据构建结果，项目生成了共享库 (.so) 文件。有几种可能：

### 情况1：项目本身只生成共享库
- 共享库需要通过其他程序加载
- 使用方法：将 .so 文件注入到目标进程中

### 情况2：需要不同的构建配置
- 项目可能通过环境变量或参数控制构建类型
- 需要修改构建配置来生成可执行文件

### 情况3：可执行文件在其他位置
- 检查 `obj/local/` 目录
- 检查是否有隐藏的可执行文件

## 当前生成的文件

项目生成了以下共享库文件：
- `libs/arm64-v8a/libshared_UEDump3r_arm64.so` (64位 ARM)
- `libs/armeabi-v7a/libshared_UEDump3r_arm.so` (32位 ARM)
- `libs/x86/libshared_UEDump3r_x86.so` (32位 x86)
- `libs/x86_64/libshared_UEDump3r_x86_64.so` (64位 x86)

## 使用共享库的方法

### 方法1：注入到目标进程
1. 将对应的 .so 文件推送到设备：
   ```bash
   adb push libs/arm64-v8a/libshared_UEDump3r_arm64.so /data/local/tmp/
