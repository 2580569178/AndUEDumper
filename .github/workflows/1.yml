name: Build AndUEDumper Simple

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup NDK
      run: |
        # 安装 NDK
        wget https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
        unzip android-ndk-r21e-linux-x86_64.zip -d /opt/
        echo "NDK=/opt/android-ndk-r21e" >> $GITHUB_ENV
        echo "PATH=/opt/android-ndk-r21e:$PATH" >> $GITHUB_ENV
    
    - name: Build
      run: |
        # 进入项目目录
        cd AndUEDumper/AndUEDumper
        
        # 运行项目自带的构建脚本
        if [ -f "ndk-build.sh" ]; then
            chmod +x ndk-build.sh
            ./ndk-build.sh
        else
            # 或者直接运行 ndk-build
            /opt/android-ndk-r21e/ndk-build
        fi
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: |
          AndUEDumper/AndUEDumper/libs/
          AndUEDumper/AndUEDumper/obj/local/*/*.so
        if-no-files-found: warn