name: Build AndUEDumper Binary

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Android NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
        unzip -q android-ndk-r21e-linux-x86_64.zip -d /opt/
    
    - name: Go to project directory
      run: |
        if [ -d "AndUEDumper-main/AndUEDumper" ]; then
          cd AndUEDumper-main/AndUEDumper
        elif [ -d "AndUEDumper" ]; then
          cd AndUEDumper
        fi
        echo "Current directory: $(pwd)"
    
    - name: Create executable build configuration
      run: |
        echo "Creating executable build configuration..."
        
        # 备份原始文件
        if [ -f "Android.mk" ]; then
          cp Android.mk Android.mk.backup
        fi
        
        # 创建只构建可执行文件的 Android.mk
        cat > Android.mk << 'EOF'
LOCAL_PATH := $(call my-dir)
include $(CLEAR_VARS)
include $(LOCAL_PATH)/src/executable.mk
EOF
        
        echo "New Android.mk created"
    
    - name: Build with NDK
      run: |
        /opt/android-ndk-r21e/ndk-build clean
        /opt/android-ndk-r21e/ndk-build
    
    - name: Check for executables
      run: |
        echo "Looking for executables..."
        find . -type f -executable ! -name "*.so" ! -name "*.sh" ! -name "*.bat" | while read f; do
          echo "Found: $f"
          file "$f"
        done
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: andue-dumper
        path: |
          libs/
          obj/
        if-no-files-found: warn
