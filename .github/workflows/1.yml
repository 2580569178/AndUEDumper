name: Build AndUEDumper (NDK only)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Download and extract Android NDK
      run: |
        # 直接下载 NDK，不通过 SDK
        wget https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
        unzip android-ndk-r25c-linux.zip -d /opt/
        
        # 设置环境变量
        echo "NDK_HOME=/opt/android-ndk-r25c" >> $GITHUB_ENV
        echo "PATH=/opt/android-ndk-r25c:$PATH" >> $GITHUB_ENV
        
        echo "NDK_HOME 设置为: $NDK_HOME"
        ls -la /opt/android-ndk-r25c/
    
    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y make build-essential clang
    
    - name: Navigate and build
      run: |
        # 进入项目目录
        if [ -d "AndUEDumper/AndUEDumper" ]; then
          cd AndUEDumper/AndUEDumper
        elif [ -d "AndUEDumper" ]; then
          cd AndUEDumper
        fi
        
        echo "构建目录: $(pwd)"
        echo "NDK_HOME: $NDK_HOME"
        
        # 显示 Makefile 内容，看看它期望什么
        echo "=== Makefile 内容 ==="
        if [ -f "Makefile" ]; then
          head -50 Makefile
        fi
        
        # 尝试构建
        echo "=== 开始构建 ==="
        make clean && make
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: |
          **/*.so
          **/*.a
          **/!(*.c|*.cpp|*.h|*.hpp|*.o|Makefile|*.mk)
        if-no-files-found: warn