name: C/C++ CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * 0'  # 每周日凌晨2点运行

env:
  CC: gcc
  CXX: g++
  CFLAGS: -O2 -g -Wall -Wextra
  CXXFLAGS: -O2 -g -Wall -Wextra

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    # 修正 cppcheck 动作名称
    - name: Run cppcheck
      uses: cppcheck/cppcheck-action@v3
    
    # 移除或注释掉 clang-tidy 部分，除非您需要它
    # - name: Run clang-tidy
    #   uses: ZedThree/clang-tidy-review@v0.14.0
    
  build-and-test:
    strategy:
      matrix:
        build-type: [Debug, Release]
        os: [ubuntu-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Cache build artifacts
      uses: actions/cache@v4
      with:
        path: |
          ~/.ccache
          ${{ github.workspace }}/build
        key: ${{ runner.os }}-${{ matrix.build-type }}-${{ hashFiles('**/*.c', '**/*.cpp', '**/*.h', '**/*.hpp') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.build-type }}-
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          autoconf \
          automake \
          libtool \
          pkg-config \
          valgrind \
          lcov \
          gcovr \
          ccache
    
    - name: Setup ccache
      run: |
        ccache --max-size=500M
        ccache --set-config=cache_dir=$HOME/.ccache
    
    - name: Configure
      run: |
        if [ -f "./autogen.sh" ]; then
          ./autogen.sh
        fi
        
        if [ -f "./configure" ]; then
          ./configure \
            --prefix=/usr/local \
            CC="ccache gcc" \
            CXX="ccache g++"
        elif [ -f "CMakeLists.txt" ]; then
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
        fi
    
    - name: Build
      run: |
        if [ -f "Makefile" ]; then
          make -j$(nproc)
        elif [ -f "build/Makefile" ]; then
          cd build
          make -j$(nproc)
        fi
    
    - name: Run unit tests
      run: |
        if [ -f "Makefile" ]; then
          make test || make check
        elif [ -f "build/Makefile" ]; then
          cd build
          make test
        fi
    
    - name: Run memory check with valgrind
      if: matrix.build-type == 'Debug'
      run: |
        if command -v valgrind &> /dev/null; then
          if [ -f "tests/test_runner" ]; then
            valgrind --leak-check=full --error-exitcode=1 ./tests/test_runner
          fi
        fi
    
    - name: Generate coverage report
      if: matrix.build-type == 'Debug'
      run: |
        if command -v lcov &> /dev/null; then
          lcov --capture --directory . --output-file coverage.info
          lcov --remove coverage.info '/usr/*' --output-file coverage.info
          genhtml coverage.info --output-directory coverage_report
        fi
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.build-type }}
        path: |
          test-suite.log
          coverage_report/
          coverage.info
        retention-days: 30
    
  distribution:
    needs: build-and-test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential autoconf automake libtool pkg-config
    
    - name: Create distribution
      run: |
        if [ -f "./autogen.sh" ]; then
          ./autogen.sh
        fi
        
        if [ -f "./configure" ]; then
          ./configure
          make distcheck
        elif [ -f "CMakeLists.txt" ]; then
          mkdir -p build_dist
          cd build_dist
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make package
        fi
    
    - name: Upload distribution artifacts
      uses: actions/upload-artifact@v4
      with:
        name: distribution-packages
        path: |
          *.tar.gz
          *.tar.bz2
          *.zip
          build_dist/*.deb
          build_dist/*.rpm
        retention-days: 30
