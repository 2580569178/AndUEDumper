name: Build AndUEDumper

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Download Android NDK r21e
      run: |
        wget https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
        unzip -q android-ndk-r21e-linux-x86_64.zip -d /opt/
        
        echo "NDK_HOME=/opt/android-ndk-r21e" >> $GITHUB_ENV
        echo "PATH=/opt/android-ndk-r21e:/opt/android-ndk-r21e/build:$PATH" >> $GITHUB_ENV
        
        # 检查 ndk-build
        echo "ndk-build 位置:"
        ls -la /opt/android-ndk-r21e/ndk-build
    
    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          make \
          build-essential \
          clang \
          gcc \
          g++ \
          file
    
    - name: Check project structure
      run: |
        echo "=== 检查项目结构 ==="
        
        # 进入项目目录
        if [ -d "AndUEDumper/AndUEDumper" ]; then
          cd AndUEDumper/AndUEDumper
        elif [ -d "AndUEDumper" ]; then
          cd AndUEDumper
        fi
        
        echo "当前目录: $(pwd)"
        echo "文件列表:"
        ls -la
        
        echo "=== 查找 Android.mk 和 Application.mk ==="
        find . -name "Android.mk" -o -name "Application.mk" | while read f; do
          echo "找到: $f"
          echo "内容预览:"
          head -20 "$f"
          echo ""
        done
        
        echo "=== 查找所有 Makefile ==="
        find . -name "Makefile" -o -name "*.mk" | head -10
    
    - name: Set up NDK environment
      run: |
        # 进入项目目录
        if [ -d "AndUEDumper/AndUEDumper" ]; then
          cd AndUEDumper/AndUEDumper
        elif [ -d "AndUEDumper" ]; then
          cd AndUEDumper
        fi
        
        echo "当前目录: $(pwd)"
        
        # 设置 NDK_PROJECT_PATH 为当前目录
        echo "NDK_PROJECT_PATH=$(pwd)" >> $GITHUB_ENV
        
        # 检查是否设置了正确的路径
        echo "环境变量:"
        echo "NDK_HOME=$NDK_HOME"
        echo "NDK_PROJECT_PATH=$NDK_PROJECT_PATH"
        echo "PATH=$PATH"
    
    - name: Build with ndk-build
      run: |
        # 进入项目目录
        if [ -d "AndUEDumper/AndUEDumper" ]; then
          cd AndUEDumper/AndUEDumper
        elif [ -d "AndUEDumper" ]; then
          cd AndUEDumper
        fi
        
        echo "构建目录: $(pwd)"
        echo "NDK_PROJECT_PATH: $NDK_PROJECT_PATH"
        
        # 确保 NDK_PROJECT_PATH 设置正确
        if [ -z "$NDK_PROJECT_PATH" ]; then
          export NDK_PROJECT_PATH=$(pwd)
          echo "设置 NDK_PROJECT_PATH 为: $NDK_PROJECT_PATH"
        fi
        
        # 检查 Android.mk 是否存在
        if [ ! -f "Android.mk" ]; then
          echo "错误: 在当前目录找不到 Android.mk"
          echo "查找 Android.mk:"
          find . -name "Android.mk" | head -5
          exit 1
        fi
        
        echo "Android.mk 存在，开始构建..."
        
        # 运行 ndk-build
        $NDK_HOME/ndk-build clean
        $NDK_HOME/ndk-build
        
        # 如果上面的命令失败，尝试不同的调用方式
        if [ $? -ne 0 ]; then
          echo "标准 ndk-build 失败，尝试其他方式..."
          
          # 方法1: 指定 NDK_PROJECT_PATH 参数
          $NDK_HOME/ndk-build NDK_PROJECT_PATH=$(pwd)
          
          # 方法2: 使用 -C 选项
          if [ $? -ne 0 ]; then
            $NDK_HOME/ndk-build -C $(pwd)
          fi
        fi
    
    - name: Find and list build outputs
      run: |
        echo "=== 查找构建产物 ==="
        
        # 检查常见的 NDK 输出目录
        echo "检查 libs/ 目录:"
        if [ -d "libs" ]; then
          find libs -type f | while read f; do
            echo "文件: $f"
            file "$f" || true
          done
        fi
        
        echo "检查 obj/ 目录:"
        if [ -d "obj" ]; then
          find obj -type f -name "*.so" | head -10
        fi
        
        echo "检查当前目录的共享库:"
        find . -name "*.so" ! -path "./.git/*" | while read f; do
          echo "共享库: $f"
          file "$f" || true
        done
        
        echo "查找所有构建产物:"
        find . -type f \( -name "*.so" -o -name "*.a" -o -name "dumper" -o -name "AndUEDumper" \) ! -path "./.git/*" | while read f; do
          echo "产物: $f"
          ls -la "$f"
        done
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: andue-dumper-build
        path: |
          **/libs/
          **/*.so
          **/*.a
          **/dumper
          **/AndUEDumper
        if-no-files-found: warn
        retention-days: 7