name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y build-essential
    
    - name: Configure
      run: ./configure || echo "No configure script found, skipping"
    
    - name: Build
      run: make || echo "Build failed or no Makefile found"
