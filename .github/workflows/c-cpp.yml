name: Build AndUEDumper Executable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-executable:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Android NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
        unzip -q android-ndk-r21e-linux-x86_64.zip -d /opt/
        echo "NDK_HOME=/opt/android-ndk-r21e" >> $GITHUB_ENV
        echo "PATH=/opt/android-ndk-r21e:$PATH" >> $GITHUB_ENV
    
    - name: Navigate to project directory
      run: |
        if [ -d "AndUEDumper-main/AndUEDumper" ]; then
          cd AndUEDumper-main/AndUEDumper
        fi
        echo "当前目录: $(pwd)"
    
    - name: Create executable-only Android.mk
      run: |
        echo "创建只构建可执行文件的 Android.mk..."
        
        # 备份原始文件
        if [ -f "Android.mk" ]; then
          cp Android.mk Android.mk.backup
        fi
        
        # 创建只包含 executable.mk 的 Android.mk
        cat > Android.mk << 'EOF'
LOCAL_PATH := $(call my-dir)

include $(CLEAR_VARS)

# 只包含 executable.mk 来构建可执行文件
include $(LOCAL_PATH)/src/executable.mk
EOF
        
        echo "新的 Android.mk 内容:"
        cat Android.mk
    
    - name: Build executable
      run: |
        echo "开始构建可执行文件版本..."
        $NDK_HOME/ndk-build clean
        $NDK_HOME/ndk-build
    
    - name: Check build results
      run: |
        echo "=== 检查生成的可执行文件 ==="
        
        # 查找可执行文件
        find . -type f \( -name "UEDump3r" -o -name "AndUEDumper" -o -name "dumper" \) ! -path "./.git/*" | while read f; do
          echo "找到: $f"
          file "$f" || true
        done
        
        # 检查 libs 目录
        if [ -d "libs" ]; then
          echo ""
          echo "libs 目录内容:"
          find libs -type f | while read f; do
            echo "  $f"
          done
        fi
        
        # 如果没找到，列出所有文件
        if [ ! -d "libs" ]; then
          echo ""
          echo "当前目录文件列表:"
          ls -la
        fi
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: andue-dumper-executable
        path: |
          libs/
          obj/local/
        if-no-files-found: warn
        retention-days: 7
