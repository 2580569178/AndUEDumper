name: Build AndUEDumper

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
          unzip android-ndk-r21e-linux-x86_64.zip -d /opt/
          echo "NDK=/opt/android-ndk-r21e" >> $GITHUB_ENV
      
      - name: Go to project
        run: |
          cd AndUEDumper-main/AndUEDumper || cd AndUEDumper
          echo "Directory: $(pwd)"
      
      - name: Fix Android.mk for executable
        run: |
          # Backup
          cp Android.mk Android.mk.backup
          
          # Create new Android.mk
          echo 'LOCAL_PATH := $(call my-dir)' > Android.mk
          echo '' >> Android.mk
          echo 'include $(CLEAR_VARS)' >> Android.mk
          echo '' >> Android.mk
          echo 'include $(LOCAL_PATH)/src/executable.mk' >> Android.mk
      
      - name: Build
        run: |
          /opt/android-ndk-r21e/ndk-build
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: |
            libs/
            obj/
          if-no-files-found: warn
