name: C/C++ CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * 0'  # 每周日凌晨2点运行

env:
  CC: gcc
  CXX: g++
  CFLAGS: -O2 -g -Wall -Wextra
  CXXFLAGS: -O2 -g -Wall -Wextra

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run cppcheck
      uses: cppcheck-action@v1
    
    - name: Run clang-tidy
      uses: ZedThree/clang-tidy-review@v0.14.0
    
  build-and-test:
    strategy:
      matrix:
        build-type: [Debug, Release]
        os: [ubuntu-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Cache build artifacts
      uses: actions/cache@v4
      with:
        path: |
          ~/.ccache
          ${{ github.workspace }}/build
        key: ${{ runner.os }}-${{ matrix.build-type }}-${{ hashFiles('**/*.c', '**/*.cpp', '**/*.h', '**/*.hpp') }}
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          autoconf \
          automake \
          libtool \
          pkg-config \
          valgrind \
          lcov \
          gcovr
    
    - name: Configure
      run: |
        ./configure \
          --prefix=/usr/local \
          --enable-debug=$([ "${{ matrix.build-type }}" = "Debug" ] && echo "yes" || echo "no")
    
    - name: Build
      run: |
        make -j$(nproc) clean
        make -j$(nproc) all
    
    - name: Run unit tests
      run: |
        make check
        # 如果有单独的测试可执行文件
        if [ -f "./tests/run_tests" ]; then
          ./tests/run_tests --gtest_output=xml:test_results.xml
        fi
    
    - name: Run memory check
      run: |
        if command -v valgrind &> /dev/null; then
          make check VALGRIND="valgrind --leak-check=full --error-exitcode=1"
        fi
    
    - name: Generate coverage report
      if: matrix.build-type == 'Debug'
      run: |
        make clean
        ./configure CFLAGS="--coverage" CXXFLAGS="--coverage" LDFLAGS="--coverage"
        make -j$(nproc)
        make check
        lcov --capture --directory . --output-file coverage.info
        lcov --remove coverage.info '/usr/*' --output-file coverage.info
        lcov --list coverage.info
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.build-type }}
        path: |
          test-suite.log
          test_results.xml
        retention-days: 30
    
  distribution:
    needs: build-and-test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential autoconf automake libtool pkg-config
    
    - name: Create distribution
      run: |
        ./autogen.sh  # 如果存在
        ./configure
        make distcheck DISTCHECK_CONFIGURE_FLAGS="--enable-silent-rules"
    
    - name: Upload distribution artifacts
      uses: actions/upload-artifact@v4
      with:
        name: distribution-packages
        path: '*.tar.gz'
        retention-days: 30
