name: Build AndUEDumper

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        path: AndUEDumper
    
    - name: Setup Android NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
        unzip -q android-ndk-r21e-linux-x86_64.zip -d /opt/
        
        echo "NDK_HOME=/opt/android-ndk-r21e" >> $GITHUB_ENV
        echo "PATH=/opt/android-ndk-r21e:$PATH" >> $GITHUB_ENV
    
    - name: Install required tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          make \
          build-essential \
          clang \
          g++ \
          python3 \
          file \
          tree
    
    - name: Build project
      run: |
        cd AndUEDumper/AndUEDumper
        
        echo "=== 构建项目 ==="
        echo "当前目录: $(pwd)"
        
        # 运行项目自带的构建脚本
        if [ -f "ndk-build.sh" ]; then
            echo "使用 ndk-build.sh"
            chmod +x ndk-build.sh
            ./ndk-build.sh
        else
            echo "直接使用 ndk-build"
            $NDK_HOME/ndk-build
        fi
    
    - name: Find all generated files
      id: find_files
      run: |
        cd AndUEDumper/AndUEDumper
        
        echo "=== 查找所有生成的文件 ==="
        echo "当前目录: $(pwd)"
        
        # 显示目录结构
        echo "目录结构:"
        tree -L 3 || ls -laR | head -100
        
        # 查找所有 .so 文件
        echo ""
        echo "=== 查找 .so 文件 ==="
        SO_FILES=$(find . -name "*.so" ! -path "./.git/*")
        if [ -n "$SO_FILES" ]; then
          echo "找到 .so 文件:"
          echo "$SO_FILES"
          echo "so_files=$SO_FILES" >> $GITHUB_OUTPUT
        else
          echo "未找到 .so 文件"
          echo "so_files=none" >> $GITHUB_OUTPUT
        fi
        
        # 查找所有可执行文件
        echo ""
        echo "=== 查找可执行文件 ==="
        EXE_FILES=$(find . -type f -executable ! -path "./.git/*" ! -name "*.so" ! -name "*.sh" ! -name "*.bat")
        if [ -n "$EXE_FILES" ]; then
          echo "找到可执行文件:"
          echo "$EXE_FILES"
          echo "exe_files=$EXE_FILES" >> $GITHUB_OUTPUT
        else
          echo "未找到可执行文件"
          echo "exe_files=none" >> $GITHUB_OUTPUT
        fi
        
        # 检查常见的 NDK 输出目录
        echo ""
        echo "=== 检查常见目录 ==="
        for dir in libs obj bin out build; do
          if [ -d "$dir" ]; then
            echo "目录 $dir 存在，内容:"
            find "$dir" -type f | head -20
          fi
        done
        
        # 列出所有文件（排除.git）
        echo ""
        echo "=== 所有文件（排除.git）==="
        find . -type f ! -path "./.git/*" | head -50
    
    - name: Upload everything (catch-all)
      uses: actions/upload-artifact@v4
      with:
        name: all-build-files
        path: |
          AndUEDumper/AndUEDumper/**
          !AndUEDumper/AndUEDumper/.git/**
          !AndUEDumper/AndUEDumper/*.c
          !AndUEDumper/AndUEDumper/*.cpp
          !AndUEDumper/AndUEDumper/*.h
          !AndUEDumper/AndUEDumper/*.hpp
        if-no-files-found: ignore
        retention-days: 7
    
    - name: Upload only binaries
      if: steps.find_files.outputs.so_files != 'none' || steps.find_files.outputs.exe_files != 'none'
      uses: actions/upload-artifact@v4
      with:
        name: binaries-only
        path: |
          # 上传所有 .so 文件
          **/*.so
          
          # 上传所有可执行文件
          **/!(*.c|*.cpp|*.h|*.hpp|*.mk|Makefile|*.txt|*.md|*.json|*.yml|*.yaml)
        if-no-files-found: ignore
        retention-days: 7
    
    - name: Create and upload package
      run: |
        cd AndUEDumper/AndUEDumper
        
        echo "创建打包文件..."
        
        # 创建时间戳
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        
        # 创建打包目录
        mkdir -p package
        
        # 复制所有可能的构建文件
        echo "收集文件..."
        
        # 复制 .so 文件
        find . -name "*.so" ! -path "./.git/*" | while read file; do
          echo "复制: $file"
          cp --parents "$file" package/ 2>/dev/null || true
        done
        
        # 复制其他二进制文件
        find . -type f -executable ! -path "./.git/*" ! -name "*.so" ! -name "*.sh" ! -name "*.bat" | while read file; do
          echo "复制可执行文件: $file"
          cp --parents "$file" package/ 2>/dev/null || true
        done
        
        # 创建压缩包
        tar -czf AndUEDumper-build-$TIMESTAMP.tar.gz -C package .
        
        echo "压缩包内容:"
        tar -tzf AndUEDumper-build-$TIMESTAMP.tar.gz | head -20
    
    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: andue-dumper-package
        path: AndUEDumper/AndUEDumper/AndUEDumper-build-*.tar.gz
        if-no-files-found: warn
        retention-days: 7
