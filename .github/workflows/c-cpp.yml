name: Build AndUEDumper

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install Android SDK tools manually
      run: |
        # 创建 Android SDK 目录
        mkdir -p ~/android-sdk/cmdline-tools
        
        # 下载并安装命令行工具
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip -q commandlinetools-linux-9477386_latest.zip -d ~/android-sdk/cmdline-tools/
        mv ~/android-sdk/cmdline-tools/cmdline-tools ~/android-sdk/cmdline-tools/latest
        
        # 设置环境变量
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$PATH" >> $GITHUB_ENV
        
        # 接受许可
        yes | sdkmanager --licenses || true
    
    - name: Install Android NDK
      run: |
        # 安装 NDK
        sdkmanager --install "ndk;25.1.8937393"
        
        # 设置 NDK_HOME
        NDK_PATH="$ANDROID_SDK_ROOT/ndk/25.1.8937393"
        echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
        echo "PATH=$NDK_PATH:$PATH" >> $GITHUB_ENV
        
        echo "NDK_HOME: $NDK_HOME"
        ls -la $NDK_HOME/toolchains/ || echo "工具链目录不存在"
    
    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          make \
          build-essential \
          clang \
          git
    
    - name: Navigate to project directory
      run: |
        echo "当前目录:"
        pwd
        ls -la
        
        # 尝试进入项目目录
        if [ -d "AndUEDumper/AndUEDumper" ]; then
          cd AndUEDumper/AndUEDumper
        elif [ -d "AndUEDumper" ]; then
          cd AndUEDumper
        fi
        
        echo "构建目录: $(pwd)"
        echo "文件列表:"
        ls -la
    
    - name: Show Makefile content
      run: |
        # 确保在正确的目录
        echo "Makefile 内容:"
        if [ -f "Makefile" ]; then
          cat Makefile || head -100 Makefile
        else
          echo "没有找到 Makefile"
          find . -name "Makefile" | head -5
        fi
        
        echo "环境变量:"
        echo "NDK_HOME=$NDK_HOME"
        echo "PATH=$PATH"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
    
    - name: Build the project
      run: |
        # 确保在正确的目录
        if [ -d "AndUEDumper/AndUEDumper" ]; then
          cd AndUEDumper/AndUEDumper
        elif [ -d "AndUEDumper" ]; then
          cd AndUEDumper
        fi
        
        echo "开始构建..."
        echo "当前目录: $(pwd)"
        
        # 清理并构建
        make clean && make
    
    - name: Find and list build artifacts
      run: |
        echo "查找构建产物..."
        find . -type f \( -name "*.so" -o -name "*.a" -o -name "dumper" -o -name "AndUEDumper" -o -perm -111 \) ! -path "./.git/*" | while read file; do
          if [ -f "$file" ]; then
            echo "文件: $file"
            file "$file" || true
          fi
        done
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: andue-dumper-build
        path: |
          **/*.so
          **/*.a
          **/dumper
          **/AndUEDumper
          **/!(*.c|*.cpp|*.h|*.hpp|*.o|Makefile)
        if-no-files-found: warn
        retention-days: 7