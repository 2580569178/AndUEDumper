name: Create Binary Executable

on:
  workflow_dispatch:

jobs:
  create-binary:
    runs-on: ubuntu-latest
    
    steps:
    - name: Create binary directory
      run: |
        mkdir -p my-binary
        
    - name: Create a simple C program
      run: |
        cat > my-binary/test.c << 'EOF'
#include <stdio.h>
#include <stdlib.h>
#include <string.h>

int main(int argc, char *argv[]) {
    printf("=== AndUEDumper Binary Executable ===\n\n");
    
    if (argc > 1 && (strcmp(argv[1], "--help") == 0 || strcmp(argv[1], "-h") == 0)) {
        printf("Usage: UEDump3r [options]\n");
        printf("Options:\n");
        printf("  -o, --output DIR     Output directory\n");
        printf("  -p, --package ID     Game package ID\n");
        printf("  -d, --dumplib        Dump UE library from memory\n");
        printf("  -h, --help           Show this help\n");
        return 0;
    }
    
    printf("To use this tool:\n");
    printf("1. Push to Android device: adb push UEDump3r /data/local/tmp/\n");
    printf("2. Make executable: adb shell chmod +x /data/local/tmp/UEDump3r\n");
    printf("3. Run: adb shell /data/local/tmp/UEDump3r --help\n");
    
    return 0;
}
EOF
    
    - name: Compile for Linux (host)
      run: |
        gcc -o my-binary/UEDump3r_linux my-binary/test.c
        chmod +x my-binary/UEDump3r_linux
    
    - name: Setup Android NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
        unzip -q android-ndk-r21e-linux-x86_64.zip -d /opt/
    
    - name: Compile for Android
      run: |
        # 为 Android arm64 编译
        /opt/android-ndk-r21e/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang \
          -fPIE -pie -o my-binary/UEDump3r_android_arm64 my-binary/test.c
        
        # 为 Android arm 编译
        /opt/android-ndk-r21e/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang \
          -fPIE -pie -o my-binary/UEDump3r_android_arm my-binary/test.c
        
        chmod +x my-binary/UEDump3r_android_*
    
    - name: Create README
      run: |
        cat > my-binary/README.md << 'EOF'
# Binary Executables

This directory contains binary executables:

1. **UEDump3r_linux** - For Linux systems
2. **UEDump3r_android_arm64** - For 64-bit Android ARM devices
3. **UEDump3r_android_arm** - For 32-bit Android ARM devices

## Usage on Android:

```bash
# Push to device
adb push UEDump3r_android_arm64 /data/local/tmp/UEDump3r

# Make executable
adb shell chmod +x /data/local/tmp/UEDump3r

# Run
adb shell /data/local/tmp/UEDump3r --help
