name: C/C++ CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * 0'  # 每周日凌晨2点运行

env:
  CC: gcc
  CXX: g++
  CFLAGS: -O2 -g -Wall -Wextra
  CXXFLAGS: -O2 -g -Wall -Wextra

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install static analysis tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cppcheck clang-tidy bear
    
    # 使用 cppcheck 进行静态代码分析
    - name: Run cppcheck
      run: |
        cppcheck --enable=all --suppress=missingIncludeSystem \
          --error-exitcode=1 --inline-suppr \
          --output-file=cppcheck-report.xml --xml \
          .
    
    # 生成编译数据库（如果需要 clang-tidy）
    - name: Generate compile_commands.json
      run: |
        if [ -f "./configure" ]; then
          bear -- ./configure
          bear -- make
        elif [ -f "CMakeLists.txt" ]; then
          cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON .
        fi
    
    # 运行 clang-tidy
    - name: Run clang-tidy
      if: hash('compile_commands.json') != ''
      run: |
        find . -name "*.cpp" -o -name "*.c" -o -name "*.cc" -o -name "*.cxx" | \
          xargs -I {} clang-tidy {} --warnings-as-errors=* -checks='*' \
          -- -I. -std=c++17 2>&1 | tee clang-tidy-report.txt
    
  build-and-test:
    strategy:
      matrix:
        build-type: [Debug, Release]
        compiler: [gcc, clang]
        os: [ubuntu-latest]
        exclude:
          - build-type: Debug
            compiler: gcc  # 可选排除某些组合
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up compiler
      run: |
        if [ "${{ matrix.compiler }}" = "gcc" ]; then
          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV
        elif [ "${{ matrix.compiler }}" = "clang" ]; then
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
        fi
    
    - name: Cache build artifacts
      uses: actions/cache@v4
      with:
        path: |
          ~/.ccache
          ${{ github.workspace }}/build
        key: ${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.build-type }}-${{ hashFiles('**/*.c', '**/*.cpp', '**/*.h', '**/*.hpp') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.build-type }}-
          ${{ runner.os }}-${{ matrix.compiler }}-
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          autoconf \
          automake \
          libtool \
          pkg-config \
          valgrind \
          lcov \
          gcovr \
          ccache
        
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          sudo apt-get install -y clang
        fi
    
    - name: Setup ccache
      run: |
        ccache --max-size=500M
        ccache --set-config=cache_dir=$HOME/.ccache
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
    
    - name: Configure
      env:
        CC: ${{ env.CC }}
        CXX: ${{ env.CXX }}
      run: |
        if [ -f "./autogen.sh" ]; then
          ./autogen.sh
        fi
        
        if [ -f "./configure" ]; then
          ./configure \
            --prefix=/usr/local \
            CC="ccache ${{ env.CC }}" \
            CXX="ccache ${{ env.CXX }}" \
            CFLAGS="${{ env.CFLAGS }}" \
            CXXFLAGS="${{ env.CXXFLAGS }}"
        elif [ -f "CMakeLists.txt" ]; then
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCMAKE_C_COMPILER="${{ env.CC }}" \
            -DCMAKE_CXX_COMPILER="${{ env.CXX }}"
        else
          echo "No configure script or CMakeLists.txt found"
          exit 1
        fi
    
    - name: Build
      run: |
        if [ -f "Makefile" ]; then
          make -j$(nproc)
        elif [ -f "build/Makefile" ]; then
          cd build
          make -j$(nproc)
        fi
    
    - name: Run tests
      run: |
        if [ -f "Makefile" ]; then
          make check || make test
        elif [ -f "build/Makefile" ]; then
          cd build
          make test
        else
          # 如果项目有测试可执行文件
          if [ -f "tests/run_tests" ]; then
            ./tests/run_tests
          fi
        fi
    
    - name: Run memory check
      if: matrix.build-type == 'Debug'
      run: |
        if command -v valgrind &> /dev/null; then
          if [ -f "tests/run_tests" ]; then
            valgrind --leak-check=full --show-leak-kinds=all --track-origins=yes \
              --error-exitcode=1 ./tests/run_tests
          fi
        fi
    
    - name: Generate coverage report
      if: matrix.build-type == 'Debug' && matrix.compiler == 'gcc'
      run: |
        if command -v lcov &> /dev/null; then
          # 清理之前的覆盖率数据
          lcov --directory . --zerocounters
          
          # 重新构建并运行测试
          make clean
          ./configure CFLAGS="--coverage" CXXFLAGS="--coverage" LDFLAGS="--coverage"
          make -j$(nproc)
          make check
          
          # 生成覆盖率报告
          lcov --capture --directory . --output-file coverage.info
          lcov --remove coverage.info '/usr/*' '*/tests/*' --output-file coverage.info
          genhtml coverage.info --output-directory coverage_report
        fi
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build-type }}
        path: |
          test-suite.log
          coverage_report/
          coverage.info
          cppcheck-report.xml
          clang-tidy-report.txt
        retention-days: 30
    
  distribution:
    needs: build-and-test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential autoconf automake libtool pkg-config
    
    - name: Create distribution
      run: |
        if [ -f "./autogen.sh" ]; then
          ./autogen.sh
        fi
        
        if [ -f "./configure" ]; then
          ./configure
          make distcheck
        elif [ -f "CMakeLists.txt" ]; then
          mkdir -p build_dist
          cd build_dist
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make package
        else
          echo "Cannot create distribution package"
          exit 1
        fi
    
    - name: Upload distribution artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: distribution-packages
        path: |
          *.tar.gz
          *.tar.bz2
          *.zip
          build_dist/*.deb
          build_dist/*.rpm
        retention-days: 30