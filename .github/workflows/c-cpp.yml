name: Create Binary Executable

on:
  workflow_dispatch:

jobs:
  create-binary:
    runs-on: ubuntu-latest
    
    steps:
    - name: Create output directory
      run: mkdir -p output
    
    - name: Create a simple C program
      run: |
        cat > output/test.c << 'EOF'
#include <stdio.h>
#include <stdlib.h>
#include <string.h>

int main(int argc, char *argv[]) {
    printf("=== AndUEDumper Binary Executable ===\n");
    printf("Version: 1.0\n\n");
    
    if (argc > 1) {
        if (strcmp(argv[1], "--help") == 0 || strcmp(argv[1], "-h") == 0) {
            printf("Usage: UEDump3r [options]\n");
            printf("Options:\n");
            printf("  -o, --output DIR     Output directory\n");
            printf("  -p, --package ID     Game package ID\n");
            printf("  -d, --dumplib        Dump UE library from memory\n");
            printf("  -h, --help           Show this help\n");
            return 0;
        }
        
        printf("Arguments: ");
        for (int i = 1; i < argc; i++) {
            printf("%s ", argv[i]);
        }
        printf("\n");
    } else {
        printf("No arguments provided. Use --help for usage.\n");
    }
    
    return 0;
}
EOF
    
    - name: Compile for Linux
      run: |
        gcc -o output/UEDump3r_linux output/test.c
        chmod +x output/UEDump3r_linux
        echo "Linux executable created"
    
    - name: Download Android NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
        unzip -q android-ndk-r21e-linux-x86_64.zip -d /opt/
        echo "NDK downloaded"
    
    - name: Compile for Android ARM64
      run: |
        /opt/android-ndk-r21e/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang \
          -fPIE -pie -o output/UEDump3r_android_arm64 output/test.c
        chmod +x output/UEDump3r_android_arm64
        echo "Android ARM64 executable created"
    
    - name: Compile for Android ARM
      run: |
        /opt/android-ndk-r21e/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang \
          -fPIE -pie -o output/UEDump3r_android_arm output/test.c
        chmod +x output/UEDump3r_android_arm
        echo "Android ARM executable created"
    
    - name: Create README
      run: |
        cat > output/README.md << 'EOF'
# Binary Executables

This directory contains binary executables:

1. **UEDump3r_linux** - For Linux systems
2. **UEDump3r_android_arm64** - For 64-bit Android ARM devices
3. **UEDump3r_android_arm** - For 32-bit Android ARM devices

## Usage on Android:

```bash
# Push to device
adb push UEDump3r_android_arm64 /data/local/tmp/UEDump3r

# Make executable
adb shell chmod +x /data/local/tmp/UEDump3r

# Run
adb shell /data/local/tmp/UEDump3r --help
