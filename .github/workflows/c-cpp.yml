name: Build AndUEDumper

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        path: AndUEDumper
    
    - name: Setup Android NDK
      run: |
        # 下载并安装 Android NDK r21e
        wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
        unzip -q android-ndk-r21e-linux-x86_64.zip -d /opt/
        
        echo "NDK_HOME=/opt/android-ndk-r21e" >> $GITHUB_ENV
        echo "PATH=/opt/android-ndk-r21e:$PATH" >> $GITHUB_ENV
        
        echo "NDK installed at: /opt/android-ndk-r21e"
    
    - name: Install required tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          make \
          build-essential \
          clang \
          g++ \
          python3 \
          file
    
    - name: Navigate to project directory
      run: |
        cd AndUEDumper/AndUEDumper
        echo "当前目录: $(pwd)"
        echo "文件列表:"
        ls -la
        
        echo "=== 查看构建脚本 ==="
        echo "Makefile 内容:"
        head -50 Makefile
        
        echo "=== 查看 Android.mk ==="
        head -50 Android.mk
        
        echo "=== 查看 Application.mk ==="
        head -50 Application.mk
    
    - name: Run ndk-build.sh
      run: |
        cd AndUEDumper/AndUEDumper
        
        echo "运行 ndk-build.sh..."
        chmod +x ndk-build.sh
        ./ndk-build.sh
        
        # 检查是否构建成功
        if [ $? -ne 0 ]; then
          echo "ndk-build.sh 失败，尝试直接 ndk-build..."
          # 如果脚本失败，尝试直接调用 ndk-build
          $NDK_HOME/ndk-build
        fi
    
    - name: Check build outputs
      run: |
        cd AndUEDumper/AndUEDumper
        
        echo "=== 检查构建输出 ==="
        
        # 查看 libs 目录
        if [ -d "libs" ]; then
          echo "libs 目录内容:"
          find libs -type f | while read f; do
            echo "  - $f (大小: $(stat -c%s "$f") bytes)"
            file "$f" 2>/dev/null || true
          done
        else
          echo "libs 目录不存在"
        fi
        
        # 查看 obj 目录
        if [ -d "obj" ]; then
          echo "obj 目录中的 .so 文件:"
          find obj -name "*.so" -type f | while read f; do
            echo "  - $f"
          done
        fi
        
        # 查找所有可能的输出文件
        echo "查找所有 .so 文件:"
        find . -name "*.so" ! -path "./.git/*" | while read f; do
          echo "  - $f"
        done
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: andue-dumper-build
        path: |
          AndUEDumper/AndUEDumper/libs/
          AndUEDumper/AndUEDumper/obj/local/
        if-no-files-found: warn
        retention-days: 7