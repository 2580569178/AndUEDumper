name: Build AndUEDumper Auto

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
        unzip -q android-ndk-r21e-linux-x86_64.zip -d /opt/
        echo "NDK_HOME=/opt/android-ndk-r21e" >> $GITHUB_ENV
    
    - name: Find project directory
      id: find_project
      run: |
        # 查找包含 Android.mk 的目录
        ANDROID_MK_PATH=$(find . -name "Android.mk" | head -1)
        if [ -z "$ANDROID_MK_PATH" ]; then
          echo "错误：找不到 Android.mk"
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$ANDROID_MK_PATH")
        echo "项目目录: $PROJECT_DIR"
        echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
    
    - name: Build
      run: |
        cd "${{ steps.find_project.outputs.project_dir }}"
        echo "构建目录: $(pwd)"
        /opt/android-ndk-r21e/ndk-build
    
    - name: Find and package outputs
      run: |
        cd "${{ steps.find_project.outputs.project_dir }}"
        
        echo "=== 打包构建产物 ==="
        
        # 创建时间戳
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        
        # 创建临时目录
        mkdir -p /tmp/build-output
        
        # 查找所有可能的输出文件
        find . -type f \( -name "*.so" -o -name "*.a" -o -name "dumper" -o -name "AndUEDumper" \) ! -path "./.git/*" | while read file; do
          echo "添加: $file"
          cp --parents "$file" /tmp/build-output/ 2>/dev/null || true
        done
        
        # 检查标准目录
        for dir in libs obj; do
          if [ -d "$dir" ]; then
            echo "添加目录: $dir"
            cp -r "$dir" /tmp/build-output/ 2>/dev/null || true
          fi
        done
        
        # 创建压缩包
        cd /tmp/build-output
        tar -czf /tmp/andue-dumper-$TIMESTAMP.tar.gz .
        
        # 移动回工作目录
        mv /tmp/andue-dumper-$TIMESTAMP.tar.gz "$GITHUB_WORKSPACE/"
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: andue-dumper-build
        path: andue-dumper-*.tar.gz
        if-no-files-found: error
